coverage:
  precision: 2
  round: up
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    # Patch status is informational: it still reports diff coverage on the PR
    # but does not block merges; the project status above keeps overall
    # coverage enforced.
    patch:
      default:
        informational: true

ignore:
  - ".idea"
  - "internal/mocks"
  - "internal/fixture"
  - "internal/assert"
  - "internal/require"
  - "internal/mocktest"
  - "internal/goleak"
